server {
    listen 80;
    server_name localhost;

    # Onde os arquivos do frontend ficarão no Nginx
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compressão GZIP para melhorar a performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    location / {
        # Tenta servir o arquivo solicitado. Se não encontrar, redireciona para index.html (essencial para React Router / SPAs)
        try_files $uri $uri/ /index.html;
    }

    # Configuração de cache para arquivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
